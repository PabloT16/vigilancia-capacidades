name: Vigilancia de capacidades

on:
  schedule:
    - cron: "*/15 4-21 1-10 * *"
    - cron: "5 */3 11-31 * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Reprocesar aunque no haya cambios"
        type: boolean
        default: false
      sin_avisos:
        description: "No enviar avisos (útil en la primera ejecución)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar publicaciones
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PANEL_URL: ${{ vars.PANEL_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.forzar }}" = "true" ]; then ARGS="$ARGS --forzar"; fi
          if [ "${{ inputs.sin_avisos }}" = "true" ]; then ARGS="$ARGS --sin-avisos"; fi
          python -m capmon vigilar $ARGS

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "vigilancia-capacidades"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state data docs
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Vigilancia $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
